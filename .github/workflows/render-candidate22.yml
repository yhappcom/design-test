name: Render Candidate 22
on:
  push:
    branches: ['candidate/22-flight-manifest']
    paths:
      - 'lib/home_candidate_22_flight_manifest.dart'
      - 'test/candidate22_render_test.dart'
      - '.github/workflows/render-candidate22.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Render 390x844 Light Dark
        run: flutter test test/candidate22_render_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: candidate22-390x844
          path: candidate22_*_390x844.png
          if-no-files-found: error
          retention-days: 14
