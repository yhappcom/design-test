name: Render Candidate 07

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/candidate07_render_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/render-candidate07.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Render Candidate 07 goldens
        run: flutter test --update-goldens test/candidate07_render_test.dart
      - name: Upload Candidate 07 renders
        uses: actions/upload-artifact@v4
        with:
          name: candidate07-390x844
          path: test/goldens/candidate07_*_390x844.png
          if-no-files-found: error
          retention-days: 14
