name: Render Candidate 10
on:
  push:
    branches: [main]
    paths: ['lib/home_candidate_10_visual.dart','test/candidate10_render_test.dart','.github/workflows/render-candidate10.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Render
        run: flutter test --update-goldens test/candidate10_render_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: candidate10-390x844
          path: test/goldens/candidate10_*_390x844.png
          if-no-files-found: error
          retention-days: 14
