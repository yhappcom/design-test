<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202326}.t20{font-size:20px;font-weight:600}.t17{font-size:17px;font-weight:600}.t15{font-size:15px}.x2{font-size:30px}.x2h{font-size:34px;font-weight:600}.muted{fill:#686d72}.rule{stroke:#d9dcdf}.frame{fill:#fafafa;stroke:#c9cdd1}.action{fill:#202326}.actionText{fill:#fff;font-size:15px;font-weight:600}.outline{fill:none;stroke:#8c9298}.focus{fill:none;stroke:#202326;stroke-width:2}.note{font-size:14px;fill:#555b61}.title{font-size:24px;font-weight:650}.num{font-variant-numeric:tabular-nums}</style><rect width="1440" height="1160" fill="#f1f2f3"/><text x="48" y="44" class="title">LogMate HOME-A/B — controlled pressure gate</text><text x="48" y="70" class="note">Non-canonical. Same candidate grammar; tests reflow, obscuration, protected first value, ad reserve and primary focus.</text>
